name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  qa:
    uses: straw-hat-team/github-actions-workflows/.github/workflows/elixir-quality-assurance.yml@5ab906d801d41b723636b498e57509e18db1856a # v1.9.1
    with:
      mix-in-umbrella-deps: true

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      MIX_IN_UMBRELLA_DEPS: true
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Elixir
        uses: straw-hat-team/github-actions-workflows/elixir/setup@55b445acf7641ffd48132742e4fe278718040d13 # master
      - name: Run integration tests
        working-directory: apps/trogon_ecto
        run: mix test --only integration
