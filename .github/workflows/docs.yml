name: hex-publish-docs

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: Package to publish docs for
        required: true
        type: choice
        options:
          - eventstore_dashboard
          - trogon_commanded
          - trogon_configurable
          - trogon_credo
          - trogon_dispatcher
          - trogon_ecto
          - trogon_error
          - trogon_object_id
          - trogon_proto
          - trogon_result
          - trogon_test
          - trogon_typeprovider

permissions: {}

jobs:
  publish-docs:
    name: Publish Docs to Hex.pm
    runs-on: ubuntu-latest
    environment: hexpm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: straw-hat-team/github-actions-workflows/elixir/publish-docs@b1d7d5d97b8fa8eff84abfc0214337e007bebb5f # v1.10.0
        with:
          package-name: ${{ inputs.package-name }}
