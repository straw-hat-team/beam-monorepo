name: hex-publish-docs

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: Package to publish docs for
        required: true
        type: choice
        options:
          - eventstore_dashboard
          - trogon_commanded
          - trogon_error
          - trogon_proto
          - trogon_result
          - trogon_typeprovider

jobs:
  publish-docs:
    name: Publish Docs to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HEX_API_KEY: "${{ secrets.SECRETS_VAULT }}/HEX_API_KEY"
      - uses: straw-hat-team/github-actions-workflows/elixir/publish-docs@0566a3861e8d30656cd902efd6208247df46bf60 # master
        with:
          hex-api-key: ${{ env.HEX_API_KEY }}
          package-name: ${{ inputs.package-name }}
